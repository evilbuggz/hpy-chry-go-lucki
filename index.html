<!doctype html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WPC1LD31ZG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-WPC1LD31ZG');
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./img/icon.png">
    <title>Just Peachy | Peachy.Love</title>
    <style>
        @font-face { font-family: Mochi; src: url('./files/mochi.ttf') format('truetype'); font-display: swap; }
        @font-face { font-family: Quilt; src: url('./files/qilt.otf') format('opentype'); font-display: swap; }
        :root { color-scheme: light; --coral: #fc8358; --peach: #ffa17f; --blush: #ffe2d8; --orange: #ef6330; --sienna: #6b311c; --brown: #351b12; --paper: #fffaf7; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 22px 28px 36px; color: var(--sienna); background: var(--blush); font: 16px/1.35 Quilt, Georgia, serif; }
        body::before { content: ""; position: fixed; inset: 0 0 auto; height: 11px; background: var(--blush); }
        .brand { position: absolute; top: 23px; left: 28px; z-index: 1; }
        .brand img { display: block; width: min(210px, 40vw); height: auto; }
        main { width: min(100%, 720px); margin: clamp(92px, 13vh, 112px) auto 28px; padding: clamp(22px, 4vw, 38px); border: 2px solid var(--sienna); border-radius: 18px; background: var(--paper); box-shadow: 12px 12px 0 var(--sienna); }
        h1, label { font-family: Mochi, Quilt, Georgia, serif; }
        h1 { margin: 0 0 5px; color: var(--brown); font-size: clamp(30px, 5vw, 46px); line-height: 1; }
        p { margin: 6px 0 14px; }
        .muted { max-width: 520px; color: var(--sienna); opacity: .78; }
        #status { min-height: 20px; margin: 12px 0 0; color: var(--orange); font-weight: 700; }
        .field { display: grid; gap: 5px; margin: 15px 0; }
        label { color: var(--brown); font-weight: 700; }
        select, button { min-height: 40px; border: 2px solid var(--sienna); border-radius: 9px; padding: 0 13px; font: inherit; }
        input { width: 100%; min-height: 46px; border: 2px solid var(--sienna); border-radius: 9px; padding: 0 15px; color: var(--sienna); background: #fff; font: inherit; }
        input:focus, select:focus, button:focus-visible { outline: 4px solid var(--peach); outline-offset: 2px; }
        select { color: var(--sienna); background: #fff; }
        button { color: var(--brown); border-color: var(--brown); background: var(--coral); cursor: pointer; font-weight: 700; }
        button:hover { background: var(--orange); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ad-section { width: min(100%, 728px); margin: 0 auto; text-align: center; }
        .ad-slot { width: 728px; max-width: 100%; height: 90px; margin: 0 auto; overflow: hidden; background: rgba(255,255,255,.45); }
        .ad-slot ins { display: block; width: 728px; height: 90px; max-width: 100%; overflow: hidden; }
        @media (max-width: 600px) { body { padding: 18px 18px 30px; } .brand { top: 22px; left: 18px; } .brand img { width: min(190px, 58vw); } main { margin-top: 112px; box-shadow: 7px 7px 0 var(--sienna); } .actions { grid-template-columns: 1fr; } }
        @media (min-width: 601px) and (max-height: 700px) { .brand img { width: 175px; } main { margin-top: 78px; padding: 20px 30px; } .field { margin: 11px 0; } }
    </style>
</head>
<body>
    <header class="brand"><img src="./img/title.png" alt="Peachy"></header>
    <main>
        <h1>Download a video</h1>
        <p class="muted">Paste a link, choose a quality, and download your video.</p>
        <div class="field">
            <label for="video-input">Video link</label>
            <input id="video-input" type="text" placeholder="Paste a video link here" autocomplete="url" spellcheck="false">
        </div>
        <div class="field">
            <label for="quality">Quality</label>
            <select id="quality" disabled><option>Choose a video first</option></select>
        </div>
        <div class="actions">
            <button id="download-button" type="button" disabled>Download</button>
            <button id="refresh" type="button">Load video</button>
        </div>
        <p id="status" role="status" aria-live="polite">Waiting for a video link.</p>
    </main>
    <section class="ad-section" aria-label="Advertisement">
        <div id="ad-slot" class="ad-slot"></div>
    </section>
    <script>
        const qualitySelect = document.querySelector('#quality');
        const videoInput = document.querySelector('#video-input');
        const downloadButton = document.querySelector('#download-button');
        const refreshButton = document.querySelector('#refresh');
        const status = document.querySelector('#status');
        let sources = [];
        let downloadInProgress = false;

        function setStatus(message) { status.textContent = message; }

        function populateSources(result) {
            sources = result.sources
                .filter((source) => source.videoUrl && source.format === 'mp4')
                .sort((first, second) => Number(second.quality || second.height) - Number(first.quality || first.height));
            qualitySelect.replaceChildren();
            sources.forEach((source, index) => qualitySelect.append(new Option(`${source.quality || source.height}p ${source.format.toUpperCase()}`, String(index))));
            qualitySelect.value = '0';
            qualitySelect.disabled = sources.length === 0;
            downloadButton.disabled = sources.length === 0;
            setStatus(sources.length ? `${sources.length} quality options ready.` : 'No downloadable video found.');
        }

        async function loadSources() {
            const input = videoInput.value.trim();
            if (!input) { setStatus('Paste a video URL or viewkey first.'); videoInput.focus(); return; }
            refreshButton.disabled = true;
            downloadButton.disabled = true;
            qualitySelect.disabled = true;
            sources = [];
            setStatus('Loading video...');
            try {
                const query = new URLSearchParams({ url: input });
                const response = await fetch(`resolve.php?${query}`, { cache: 'no-store' });
                const result = await response.json();
                if (!response.ok || result.error) throw new Error(result.error || `Resolver returned ${response.status}.`);
                populateSources(result);
            } catch (error) {
                qualitySelect.replaceChildren(new Option('No sources available'));
                setStatus(`${error.message} Please try again.`);
            } finally { refreshButton.disabled = false; }
        }

        function downloadVideo() {
            const source = sources[Number(qualitySelect.value)];
            if (!source || downloadInProgress) return;
            downloadInProgress = true;
            downloadButton.disabled = true;
            refreshButton.disabled = true;
            const query = new URLSearchParams({ url: videoInput.value.trim(), quality: source.quality || '' });
            const frame = document.createElement('iframe');
            frame.title = 'Download';
            frame.hidden = true;
            document.body.append(frame);
            frame.src = `download.php?${query}`;
            setTimeout(() => frame.remove(), 10 * 60 * 1000);
            setStatus('Your download has started.');
            downloadInProgress = false;
            downloadButton.disabled = !sources.length;
            refreshButton.disabled = false;
        }

        async function loadAds() {
            try {
                const config = await fetch('./ads.json', { cache: 'no-store' }).then((response) => response.json());
                const slots = Array.isArray(config.slots) ? config.slots.slice(0, 5) : [];
                if (!slots.length) return;
                let index = 0;
                const render = () => {
                    const adSlot = document.querySelector('#ad-slot');
                    const ad = slots[index % slots.length];
                    adSlot.replaceChildren();
                    const ins = document.createElement('ins');
                    ins.dataset.trZone = ad.zone;
                    ins.style.cssText = 'display:block;width:728px;height:90px;max-width:100%;overflow:hidden;';
                    adSlot.append(ins);
                    const script = document.createElement('script');
                    script.async = true;
                    script.src = 'https://s.ad.twinrdengine.com/adlib.js';
                    adSlot.append(script);
                    index += 1;
                };
                render();
                setInterval(render, Number(config.intervalMs) > 0 ? config.intervalMs : 30000);
            } catch (error) { console.warn('Ads could not be loaded.', error); }
        }

        refreshButton.addEventListener('click', loadSources);
        videoInput.addEventListener('input', () => { sources = []; qualitySelect.disabled = true; downloadButton.disabled = true; setStatus('Press Load video to continue.'); });
        videoInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); loadSources(); } });
        downloadButton.addEventListener('click', downloadVideo);
        loadAds();
    </script>
</body>
</html>
