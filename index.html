<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<title>Signed video download demo</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202326;
			--muted: #687078;
			--line: #d9dee3;
			--accent: #e66a3d;
			--paper: #fffdf9;
			--panel: #ffffff;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background: linear-gradient(135deg, #f8e8dc, #edf2f3 55%, #dbe8e5);
			font: 16px/1.5 Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 680px);
			padding: clamp(24px, 5vw, 48px);
			border: 1px solid rgba(32, 35, 38, .12);
			border-radius: 8px;
			background: var(--paper);
			box-shadow: 0 18px 50px rgba(32, 35, 38, .12);
		}

		h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; }
		p { margin: 8px 0 20px; }
		.muted, #status { color: var(--muted); }
		.field { display: grid; gap: 7px; margin: 22px 0; }
		label { font-weight: 700; }
		select, button {
			min-height: 44px;
			border: 1px solid var(--line);
			border-radius: 5px;
			padding: 0 13px;
			font: inherit;
		}
		input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 5px; padding: 0 13px; color: var(--ink); background: var(--panel); font: inherit; }
		select { color: var(--ink); background: var(--panel); }
		button { color: #fff; border-color: var(--accent); background: var(--accent); cursor: pointer; font-weight: 700; }
		button:disabled { opacity: .55; cursor: wait; }
		.actions { display: flex; flex-wrap: wrap; gap: 10px; }
		.secondary { color: var(--ink); border-color: var(--line); background: transparent; }
		.notice { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .94rem; }
		code { font-family: Consolas, monospace; font-size: .9em; }
	</style>
</head>
<body>
	<main>
		<h1>Signed video download</h1>
		<p class="muted">This example requests a fresh source through a serverless API.</p>

		<div class="field">
			<label for="video-input">Video URL or viewkey</label>
			<input id="video-input" type="text" value="6a0f3e5a30bab" autocomplete="url" spellcheck="false">
		</div>

		<div class="field">
			<label for="quality">Quality</label>
			<select id="quality" disabled>
				<option>Loading sources...</option>
			</select>
		</div>

		<div class="actions">
			<button id="download" type="button" disabled>Download video</button>
			<button id="open-source" class="secondary" type="button" disabled>Open source</button>
			<button id="refresh" class="secondary" type="button">Refresh source</button>
		</div>
		<p id="status" role="status" aria-live="polite">Requesting a fresh source...</p>

		<div class="notice">
			The serverless API refreshes the signed MP4 source when this page loads and streams
			the download locally, so the browser does not need cross-origin access.
		</div>
	</main>

	<script>
		const qualitySelect = document.querySelector('#quality');
		const videoInput = document.querySelector('#video-input');
		const downloadButton = document.querySelector('#download');
		const openSourceButton = document.querySelector('#open-source');
		const refreshButton = document.querySelector('#refresh');
		const status = document.querySelector('#status');
		let sources = [];

		function setStatus(message) {
			status.textContent = message;
		}

		function populateSources(clipsData) {
			sources = clipsData.mediaDefinition
				.filter((source) => source.videoUrl && source.format === 'mp4')
				.sort((first, second) => Number(second.quality || second.height) - Number(first.quality || first.height));

			qualitySelect.replaceChildren();
			sources.forEach((source, index) => {
				const option = document.createElement('option');
				option.value = String(index);
				option.textContent = `${source.quality || source.height}p ${source.format.toUpperCase()}`;
				qualitySelect.append(option);
			});

			const mp4Index = sources.findIndex((source) => source.format === 'mp4');
			qualitySelect.value = String(mp4Index >= 0 ? mp4Index : 0);
			qualitySelect.disabled = sources.length === 0;
			downloadButton.disabled = sources.length === 0;
			openSourceButton.disabled = sources.length === 0;
			setStatus(sources.length ? `${sources.length} signed source(s) loaded.` : 'No downloadable source was found.');
		}

		async function loadSources() {
			refreshButton.disabled = true;
			downloadButton.disabled = true;
			openSourceButton.disabled = true;
			sources = [];
			setStatus('Requesting a fresh source...');
			try {
				const query = new URLSearchParams({ url: videoInput.value.trim() });
				const response = await fetch(`/api/resolve?${query}`, { cache: 'no-store' });
				const result = await response.json().catch(() => ({ error: `Resolver returned HTTP ${response.status}.` }));
				if (!response.ok) console.error('Video resolver failed', { status: response.status, requestId: response.headers.get('x-request-id'), result });
				if (!response.ok || result.error) throw new Error(result.error || `Resolver returned ${response.status}.`);
				populateSources({ mediaDefinition: result.sources });
			} catch (error) {
				qualitySelect.replaceChildren(new Option('No sources available'));
				qualitySelect.disabled = true;
				openSourceButton.disabled = true;
				setStatus(`${error.message} Check the serverless function logs.`);
			} finally {
				refreshButton.disabled = false;
			}
		}

		function getSelectedSource() {
			const source = sources[Number(qualitySelect.value)];
			return source;
		}

		function openSelectedSource() {
			const source = getSelectedSource();
			if (!source) return;

			window.open(source.videoUrl, '_blank', 'noopener');
			setStatus('The server-side source was opened in a new tab.');
		}

		function downloadSelectedSource() {
			const source = getSelectedSource();
			if (!source) return;

			const link = document.createElement('a');
			const query = new URLSearchParams({
				url: videoInput.value.trim(),
				quality: source.quality || '',
			});
			link.href = `/api/download?${query}`;
			link.download = `video-${source.quality || source.height}p.mp4`;
			link.click();
			setStatus('Download requested through the local server.');
		}

		refreshButton.addEventListener('click', loadSources);
		videoInput.addEventListener('input', () => {
			sources = [];
			downloadButton.disabled = true;
			openSourceButton.disabled = true;
			setStatus('Press Refresh source to load this video.');
		});
		downloadButton.addEventListener('click', downloadSelectedSource);
		openSourceButton.addEventListener('click', openSelectedSource);
		loadSources();
	</script>
</body>
</html>
